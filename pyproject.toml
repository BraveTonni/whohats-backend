[project]
name = "whohats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "jinja2>=3.1.6",
    "orjson>=3.11.4",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[tool.pylint]
disable = [
    "missing-module-docstring",
    "missing-class-docstring"
]

[tool.ruff.lint.pycodestyle]
max-line-length = 116